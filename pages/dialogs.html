    <!--
  ============================================================
  13. KANA POPUP (detail huruf)
  ============================================================
  Kotak yang muncul saat sebuah huruf kana diklik.
  Awalnya tersembunyi (CSS: .kana-pop tidak tampil).
  JS mengisi #popGlyph (huruf), #popRom (bacaan), #popRow (baris),
  lalu menambahkan class "show" supaya muncul.

  Isinya 3 tombol: Dengar / Tandai Hafal / Tutup.
  ============================================================
-->
    <div class="kana-pop" id="kanaPop">
      <div class="glass kana-pop-card">
        <div class="big" id="popGlyph">あ</div>
        <div class="rom2" id="popRom">a</div>
        <div class="row-tag" id="popRow">Vokal</div>
        <div class="kana-pop-actions">
          <button class="btn btn-primary" id="popSpeak">Dengar</button>
          <button class="btn btn-ghost" id="popToggle">Tandai Hafal</button>
          <button class="btn btn-ghost" id="popClose">Tutup</button>
        </div>
        <div class="stroke-hint" id="popHint"></div>
      </div>
    </div>

    <!--
  ============================================================
  14. ADMIN MODAL (panel pengurus)
  ============================================================
  Kotak besar yang muncul saat tombol kunci di nav diklik.

  Dua tampilan, hanya satu yang aktif:
    #adminLoginView -> form username + password
    #adminDash      -> panel setelah berhasil login
                       (hidden = disembunyikan CSS)

  Di dalam panel ada 2 tab: Info Pertemuan dan Pesan Pribadi.
  ============================================================
-->
    <div class="modal" id="adminModal">
      <div class="modal-card glass">
        <button class="modal-x" id="adminClose" aria-label="Tutup">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>

        <div id="adminLoginView">
          <div class="modal-head">
            <span class="modal-ic">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.9"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="4.5" y="10.5" width="15" height="9.5" rx="2.5" />
                <path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" />
              </svg>
            </span>
            <div>
              <h3>Masuk Pengurus</h3>
              <p>Khusus pengurus Aozora Nihongo Club.</p>
            </div>
          </div>
          <form id="adminLogin">
            <div class="field">
              <label for="adminUser">Username</label
              ><input type="text" id="adminUser" placeholder="admin" autocomplete="username" />
            </div>
            <div class="field">
              <label for="adminPass">Password</label
              ><input
                type="password"
                id="adminPass"
                placeholder="••••••••"
                autocomplete="current-password"
              />
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%">Masuk</button>
            <div class="admin-err" id="adminErr"></div>
          </form>
        </div>

        <div id="adminDash" class="hidden">
          <div class="modal-head">
            <span class="modal-ic ok">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.9"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M20 6L9 17l-5-5" />
              </svg>
            </span>
            <div>
              <h3>Panel Pengurus</h3>
              <p>Kelola info pertemuan dan pesan pribadi.</p>
            </div>
            <button
              class="btn btn-ghost"
              id="adminLogout"
              style="margin-left: auto; padding: 9px 16px; font-size: 13px"
            >
              Keluar
            </button>
          </div>

          <div class="admin-tabs">
            <button class="atab active" data-atab="forum">Info Pertemuan</button>
            <button class="atab" data-atab="private">Pesan Pribadi</button>
          </div>

          <div class="admin-pane" data-apane="forum">
            <div class="field">
              <label for="fHari">Hari</label
              ><input type="text" id="fHari" placeholder="Kamis" maxlength="20" />
            </div>
            <div class="field">
              <label for="fTempat">Tempat</label
              ><input type="text" id="fTempat" placeholder="C107" maxlength="30" />
            </div>
            <div class="field">
              <label for="fWaktu">Waktu</label
              ><input type="text" id="fWaktu" placeholder="15.30 – selesai" maxlength="30" />
            </div>
            <div class="field">
              <label for="fCatatan">Catatan</label
              ><textarea
                id="fCatatan"
                style="min-height: 80px"
                maxlength="200"
                placeholder="Info tambahan…"
              ></textarea>
            </div>
            <button class="btn btn-primary" id="fSave" style="width: 100%">Simpan Info</button>
          </div>

          <div class="admin-pane hidden" data-apane="private">
            <div class="admin-list" id="privateList"></div>
          </div>

        </div>
      </div>
    </div>
