    <!--
  ============================================================
  4. NAV (menu navigasi atas)
  ============================================================
  <nav> = tag semantik untuk menu utama.

  Isinya:
    .admin-corner -> tombol kunci (login pengurus)
    .brand        -> logo + nama eskul, diklik balik ke atas
    .nav-links    -> daftar link ke tiap bagian (#kana, #kosakata, dst)
                     tanda # artinya "lompat ke elemen dengan id itu"
    #themeToggle  -> tombol mode gelap/terang (ada 2 ikon: matahari & bulan,
                        CSS yang memilih mana yang tampil)
    .nav-burger   -> tombol menu pada ukuran tablet/layar menengah
    .nav-cta      -> tombol "Kirim Pesan" di menu desktop (disembunyikan di HP)

  Di HP, menu memakai dock bawah lima tujuan utama; halaman berpindah tanpa menggulir seluruh dokumen.
  Menu hamburger dipakai pada ukuran tablet/layar menengah.
  ============================================================
-->
    <nav class="nav" id="nav">
      <button
        type="button"
        class="admin-corner"
        id="adminCorner"
        title="Masuk sebagai admin"
        aria-label="Admin"
        aria-haspopup="dialog"
        aria-controls="adminModal"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.9"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="4.5" y="10.5" width="15" height="9.5" rx="2.5" />
          <path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" />
        </svg>
        <span>Admin</span>
      </button>
      <a class="brand" href="#home">
        <img src="assets/logo-nobg.png" alt="Logo" />
        <span class="brand-txt">
          <b>Aozora Nihongo Club</b>
          <small>青空日本語 · SMKN 1 Purwokerto</small>
        </span>
      </a>
      <div class="nav-links" id="navLinks">
        <a href="#home" class="active">Beranda</a>
        <a href="#belajar">Belajar</a>
        <a href="#kegiatan">Kegiatan</a>
        <a href="#pesan">Pesan</a>
      </div>
      <button class="icon-btn" id="themeToggle" aria-label="Ganti tema" title="Mode gelap / terang">
        <svg
          class="sun"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.9"
          stroke-linecap="round"
        >
          <circle cx="12" cy="12" r="4.2" />
          <path
            d="M12 2v2.4M12 19.6V22M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2 12h2.4M19.6 12H22M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"
          />
        </svg>
        <svg
          class="moon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.9"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z" />
        </svg>
      </button>
      <button type="button" class="nav-burger" id="navBurger" aria-label="Buka menu navigasi" aria-controls="navLinks" aria-expanded="false"><i></i><i></i><i></i></button>
      <a href="#pesan" class="nav-cta">Kirim Pesan</a>
    </nav>
